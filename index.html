<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot của tôi</title>
  <style>
    body { font-family: Arial, sans-serif; background: #131314; color: #e3e3e3; display: flex; flex-direction: column; height: 100vh; margin: 0; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; max-width: 750px; width: 100%; margin: auto; box-sizing: border-box; }
    .msg { margin: 12px 0; padding: 12px 16px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; }
    .user { background: #282a2c; margin-left: auto; max-width: 75%; }
    .bot { background: #1e1f20; border: 1px solid #333; max-width: 85%; }
    #input-box { display: flex; gap: 10px; padding: 15px; max-width: 750px; width: 100%; margin: auto; box-sizing: border-box; }
    input { flex: 1; padding: 12px 16px; border-radius: 24px; border: 1px solid #444; background: #1e1f20; color: white; font-size: 16px; outline: none; }
    button { padding: 12px 22px; border-radius: 24px; border: none; background: #a8c7fa; color: #062e6f; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div id="chat"><div class="msg bot">Chào bạn! Hỏi mình bất cứ gì nhé.</div></div>
  <div id="input-box">
    <input id="prompt" placeholder="Nhập tin nhắn..." onkeypress="if(event.key==='Enter') send()">
    <button onclick="send()">Gửi</button>
  </div>

  <script>
    const API_KEY = "AQ.Ab8RN6KgdWBIQdtv-meTA6LZvGkr6isxL-jh8Fs37OK_MYujAQ";

    async function send() {
      const input = document.getElementById("prompt");
      const chat = document.getElementById("chat");
      const text = input.value.trim();
      if (!text) return;

      chat.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = "";
      const botDiv = document.createElement("div");
      botDiv.className = "msg bot";
      botDiv.innerText = "Đang suy nghĩ...";
      chat.appendChild(botDiv);
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text }] }] })
        });
        const data = await res.json();
        botDiv.innerText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Lỗi: " + JSON.stringify(data);
      } catch (e) {
        botDiv.innerText = "Lỗi kết nối mạng!";
      }
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
