<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tusigma // Tú Console</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0d1117;
      color: #e6edf3;
      font-family: Consolas, "Courier New", monospace, Arial, sans-serif;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 18px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      font-size: 15px;
      letter-spacing: 0.5px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3fb950;
      box-shadow: 0 0 8px #3fb950;
    }

    .modes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .mode-btn {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #c9d1d9;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: 0.15s;
    }
    .mode-btn:hover { border-color: #8b949e; }
    .mode-btn.active {
      border-color: #58a6ff;
      background: #1f3a5f;
      color: #ffffff;
      font-weight: bold;
    }
    .mode-btn[data-mode="hacker"].active {
      border-color: #3fb950;
      background: #12331b;
      color: #7ee787;
    }
    .mode-btn[data-mode="pro"].active {
      border-color: #d29922;
      background: #3b2d0d;
      color: #f2cc60;
    }

    .new-chat-btn {
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid #388bfd;
      background: #1f6feb;
      color: #ffffff;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .new-chat-btn:hover { background: #388bfd; }

    .key-bar {
      display: flex;
      gap: 8px;
      padding: 8px 18px;
      background: #010409;
      border-bottom: 1px solid #21262d;
      align-items: center;
      flex-wrap: wrap;
    }
    .key-bar input {
      flex: 1;
      min-width: 220px;
      max-width: 420px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #7ee787;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }
    .key-bar button {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #e6edf3;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .key-bar button:hover { background: #30363d; }

    .telemetry {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 18px;
      font-size: 12px;
      color: #8b949e;
      background: #0b0f14;
      border-bottom: 1px solid #21262d;
    }
    body.hacker-ui .telemetry { color: #7ee787; }
    body.pro-ui .telemetry { color: #f2cc60; }

    .chat-shell {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
    }
    .msg {
      margin: 12px 0;
      padding: 12px 15px;
      border-radius: 12px;
      line-height: 1.55;
      font-size: 14px;
      word-break: break-word;
    }
    .msg.user {
      background: #1f2937;
      border: 1px solid #374151;
      margin-left: auto;
      max-width: 78%;
      white-space: pre-wrap;
    }
    .msg.bot {
      background: #161b22;
      border: 1px solid #30363d;
      max-width: 90%;
    }
    body.hacker-ui .msg.bot { border-color: #238636; }
    body.pro-ui .msg.bot { border-color: #9e6a03; }
    .msg-tag {
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 6px;
      display: block;
    }
    .msg.bot pre {
      background: #090c10;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      border: 1px solid #21262d;
    }
    .msg.bot p { margin: 6px 0; }
    .msg.bot p:first-child { margin-top: 0; }
    .msg.bot p:last-child { margin-bottom: 0; }

    .input-wrap {
      display: flex;
      gap: 10px;
      padding: 14px 18px;
      background: #161b22;
      border-top: 1px solid #30363d;
    }
    .input-inner {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
    }
    #prompt {
      flex: 1;
      padding: 11px 15px;
      border-radius: 10px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }
    #prompt:focus { border-color: #58a6ff; }
    #send-btn {
      padding: 11px 20px;
      border-radius: 10px;
      border: none;
      background: #238636;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    #send-btn:hover { background: #2ea043; }
    #send-btn:disabled, #prompt:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span>TUSIGMA // CONSOLE</span>
    </div>

    <div class="modes">
      <button class="mode-btn active" data-mode="auto" onclick="setMode('auto')">Tú tự động</button>
      <button class="mode-btn" data-mode="pro" onclick="setMode('pro')">Tú pro</button>
      <button class="mode-btn" data-mode="hacker" onclick="setMode('hacker')">Tú hacker</button>
      <button class="new-chat-btn" onclick="newChat()">Cuộc trò chuyện mới</button>
    </div>
  </div>

  <div class="key-bar">
    <span style="font-size: 12px; color: #8b949e;">OpenRouter Key:</span>
    <input id="api-key-input" type="password" placeholder="Dán key OpenRouter (sk-or-v1-...) vào đây rồi bấm Lưu">
    <button onclick="saveKey()">Lưu Key</button>
  </div>

  <div class="telemetry">
    <span id="status-mode">Chế độ hiện tại: Tú tự động [AUTO-SYNC]</span>
    <span id="status-scan">Pipeline: READY</span>
  </div>

  <div class="chat-shell" id="chat">
    <div class="msg bot">
      <span class="msg-tag">[TÚ TỰ ĐỘNG] • Hệ thống sẵn sàng</span>
      <div>Chào bạn! Nhập câu hỏi để bắt đầu trò chuyện nhé (key đã gắn sẵn, hoặc bạn có thể đổi key khác ở ô phía trên rồi bấm Lưu Key).</div>
    </div>
  </div>

  <div class="input-wrap">
    <div class="input-inner">
      <input id="prompt" type="text" placeholder="Nhập lệnh hoặc câu hỏi..." onkeydown="if(event.key==='Enter') sendMsg()">
      <button id="send-btn" onclick="sendMsg()">Gửi</button>
    </div>
  </div>

  <script>
    const DEFAULT_OR_KEY = "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";

    const MODE_META = {
      auto: {
        label: "Tú tự động",
        bar: "Chế độ hiện tại: Tú tự động [AUTO-ROUTER v4.2]",
        bodyClass: ""
      },
      pro: {
        label: "Tú pro",
        bar: "Chế độ hiện tại: Tú pro [DEEP-SYNTHESIS ENGINE]",
        bodyClass: "pro-ui"
      },
      hacker: {
        label: "Tú hacker",
        bar: "Chế độ hiện tại: Tú hacker [ROOT-TRACE // OVERRIDE]",
        bodyClass: "hacker-ui"
      }
    };

    let currentMode = "auto";
    let messages = [];

    window.onload = () => {
      const savedKey = localStorage.getItem("tusigma_or_key") || DEFAULT_OR_KEY;
      document.getElementById("api-key-input").value = savedKey;
      if (!localStorage.getItem("tusigma_or_key")) {
        localStorage.setItem("tusigma_or_key", DEFAULT_OR_KEY);
      }
    };

    function saveKey() {
      const val = document.getElementById("api-key-input").value.trim();
      if (!val) return alert("Bạn chưa dán Key!");
      localStorage.setItem("tusigma_or_key", val);
      alert("Đã lưu Key trên trình duyệt máy bạn!");
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function setMode(mode) {
      if (!MODE_META[mode]) return;
      currentMode = mode;
      document.body.className = MODE_META[mode].bodyClass;
      document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.mode === mode);
      });
      document.getElementById("status-mode").textContent = MODE_META[mode].bar;
      document.getElementById("status-scan").textContent = `Pipeline: ${mode.toUpperCase()}-ARMED`;
    }

    function newChat() {
      messages = [];
      document.getElementById("chat").innerHTML = "";
      addBotCard(
        `[${MODE_META[currentMode].label.toUpperCase()}] • Cuộc trò chuyện mới`,
        "Đã làm mới phiên trò chuyện. Bắt đầu câu hỏi mới nhé!",
        false
      );
    }

    function addUserCard(text) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = "msg user";
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addBotCard(tagText, contentText, useMarkdown = false) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = "msg bot";

      const tag = document.createElement("span");
      tag.className = "msg-tag";
      tag.textContent = tagText;

      const body = document.createElement("div");
      if (useMarkdown && window.marked) {
        body.innerHTML = marked.parse(contentText);
      } else {
        body.innerText = contentText;
      }

      div.appendChild(tag);
      div.appendChild(body);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return { card: div, tag, body };
    }

    async function runFakeAnalysis(botUI) {
      const modeName = MODE_META[currentMode].label;
      const steps = [
        `[${modeName}] Đang phân tách ngữ cảnh & token đầu vào (bước 1/4)...`,
        `[${modeName}] Đang đối chiếu ma trận logic & cấu trúc phản hồi (bước 2/4)...`,
        `[${modeName}] Đang tối ưu đường truyền & kiểm tra tính nhất quán (bước 3/4)...`,
        `[${modeName}] Đang tổng hợp kết quả cuối cùng từ lõi xử lý (bước 4/4)...`
      ];

      for (let i = 0; i < steps.length; i++) {
        document.getElementById("status-scan").textContent = `Phân tích: ${steps[i]}`;
        botUI.body.innerText = steps[i];
        await sleep(950);
      }
    }

    async function sendMsg() {
      const apiKey = (localStorage.getItem("tusigma_or_key") || document.getElementById("api-key-input").value || "").trim();
      if (!apiKey) {
        alert("Vui lòng dán OpenRouter Key vào ô phía trên và bấm Lưu Key trước!");
        return;
      }

      const input = document.getElementById("prompt");
      const btn = document.getElementById("send-btn");
      const scanEl = document.getElementById("status-scan");
      const text = input.value.trim();
      if (!text) return;

      addUserCard(text);
      input.value = "";
      input.disabled = true;
      btn.disabled = true;

      const modeName = MODE_META[currentMode].label;
      messages.push({ role: "user", content: text });

      const botUI = addBotCard(
        `[${modeName.toUpperCase()}] • Đang phân tích chuyên sâu...`,
        "Đang khởi tạo tiến trình...",
        false
      );

      try {
        await runFakeAnalysis(botUI);
        scanEl.textContent = "Đang nhận phản hồi từ máy chủ...";

        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: "openrouter/free",
            messages: messages
          })
        });

        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content;

        if (reply) {
          messages.push({ role: "assistant", content: reply });
          botUI.tag.textContent = `[${modeName.toUpperCase()}] • Phân tích hoàn tất`;
          botUI.body.innerHTML = window.marked ? marked.parse(reply) : reply;
          scanEl.textContent = "Pipeline: COMPLETED";
        } else {
          messages.pop();
          const errMsg = data.error?.message || JSON.stringify(data);
          botUI.tag.textContent = `[${modeName.toUpperCase()}] • Cảnh báo hệ thống`;
          botUI.body.innerText = "Lỗi API: " + errMsg;
          scanEl.textContent = "Pipeline: API_ERROR";
        }
      } catch (err) {
        messages.pop();
        botUI.tag.textContent = `[${modeName.toUpperCase()}] • Lỗi kết nối`;
        botUI.body.innerText = "Lỗi mạng: " + err.message;
        scanEl.textContent = "Pipeline: NETWORK_ERROR";
      } finally {
        input.disabled = false;
        btn.disabled = false;
        input.focus();
        document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
      }
    }
  </script>
</body>
</html>
